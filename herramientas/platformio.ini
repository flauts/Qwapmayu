; =============================================================
; QawapMayu - Herramientas de laboratorio
; Cada [env:...] es un programa distinto. En VS Code elijan el
; entorno en la barra inferior (icono de carpeta "env:...") y
; luego Upload + Monitor. Por consola:
;    pio run -e sensores -t upload -t monitor
; =============================================================
[platformio]
default_envs = sensores

[env]
platform = espressif32
board = esp32doit-devkit-v1
framework = arduino
monitor_speed = 115200
monitor_eol = CRLF
monitor_echo = yes
monitor_filters = send_on_enter
build_flags = -I../comun

; pH + TDS + temperatura, con asistente de calibracion de pH
[env:sensores]
build_src_filter = -<*> +<sensores.cpp>
lib_deps =
  paulstoffregen/OneWire
  milesburton/DallasTemperature

; Puente USB <-> RAK3272S para escribir comandos AT a mano
[env:puente_rak]
build_src_filter = -<*> +<puente_rak.cpp>

; Comportamiento del rele al arrancar y conmutar
[env:rele_arranque]
build_src_filter = -<*> +<rele_arranque.cpp>

; Maquina de estados del muestreador con LED/rele y NVS
[env:fsm_led]
build_src_filter = -<*> +<fsm_led.cpp>
