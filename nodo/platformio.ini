; QawapMayu - Nodo QM01
[platformio]
monitor_dir = ../herramientas/monitor

[env:nodo]
platform = espressif32@8.0.0
board = esp32doit-devkit-v1
framework = arduino
monitor_speed = 115200
monitor_eol = CRLF
monitor_echo = yes
monitor_filters = send_on_enter, evidencia
build_flags = -I../comun -DTDS0_AUTO_MUESTRAS=12
lib_deps =
  paulstoffregen/OneWire
  milesburton/DallasTemperature
