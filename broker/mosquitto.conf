# Configuracion del broker Mosquitto para QawapMayu (red local / hotspot)
# Listeners: MQTT TCP en 1883 y WebSockets en 9001 (ambos en todas las interfaces)

persistence true
persistence_location /tmp/qawapmayu-mosquitto/
persistence_file mosquitto.db

allow_anonymous true

listener 1883 0.0.0.0
protocol mqtt

listener 9001 0.0.0.0
protocol websockets
